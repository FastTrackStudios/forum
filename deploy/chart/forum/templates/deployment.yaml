apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum
  labels:
    app: forum
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Recreate, not RollingUpdate. The uploads PVC is ReadWriteMany so two
    # pods CAN mount it, but a rolling update would start the new pod's
    # `db:migrate` while the old pod is still serving the old schema. A few
    # seconds of downtime on a forum is cheaper than that.
    type: Recreate
  selector:
    matchLabels:
      app: forum
  template:
    metadata:
      labels:
        app: forum
      annotations:
        checksum/secret-name: {{ .Values.secretName | sha256sum }}
    spec:
      # k8s injects <SVC>_PORT=tcp://… for every service in the namespace;
      # they collide with app config.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # The NFS volume arrives root-owned; without this the non-root
        # process cannot write uploads.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forum
          # argocd-image-updater writes the FULL reference back into
          # image.repository (registry included), so prefixing
          # image.registry unconditionally yields
          #   registry.starcommand.live:30050/registry.starcommand.live:30050/forum
          # and the pod sits in InvalidImageName. Only prefix when the
          # repository is bare. The sibling fts-auth and task charts hit
          # this first; this chart was copied from fts-auth before its fix.
          image: "{{ if contains "/" .Values.image.repository }}{{ .Values.image.repository }}{{ else }}{{ .Values.image.registry }}/{{ .Values.image.repository }}{{ end }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: DISCOURSE_HOSTNAME
              value: {{ .Values.hostname | quote }}
            # Whether this pod runs db:migrate at boot. Always true for a
            # single-replica Deployment; the knob exists so a second pod
            # (a sidekiq-only one, say) can be told not to race it.
            - name: FORUM_RUN_MIGRATIONS
              value: {{ .Values.runMigrations | ternary "1" "0" | quote }}
            - name: DISCOURSE_DEVELOPER_EMAILS
              value: {{ .Values.developerEmails | quote }}
            - name: DISCOURSE_SERVE_STATIC_ASSETS
              value: {{ .Values.serveStaticAssets | quote }}
            # Site settings applied at boot, shape { category: { setting:
            # value } }. nixpkgs patches Discourse to read these from
            # config/nixos_site_settings.json, which the entrypoint writes
            # from this value. Settings named here are pinned: editing them
            # in /admin will not stick across a restart.
            - name: FORUM_SITE_SETTINGS_JSON
              value: {{ .Values.siteSettings | toJson | quote }}

            - name: UNICORN_WORKERS
              value: {{ .Values.unicorn.workers | quote }}
            - name: UNICORN_SIDEKIQS
              value: {{ .Values.unicorn.sidekiqs | quote }}
            - name: UNICORN_TIMEOUT
              value: {{ .Values.unicorn.timeout | quote }}
            # Ruby's allocator fragments badly across unicorn forks; the
            # upstream image sets the same cap.
            - name: MALLOC_ARENA_MAX
              value: "2"
            # Dispose V8 contexts before forking instead of carrying them
            # across. Discourse defaults this true, taking the branch in
            # Discourse.before_fork that only sends low_memory_notification
            # and KEEPS the contexts, trusting single-threaded V8 to
            # survive fork. It does not survive it here: every pitchfork
            # worker died on boot with
            #   [BUG] Segmentation fault
            #   mini_racer: v8::Context::Enter / v8_single_threaded_enter
            # so /srv/status answered (it touches no JS) while any real
            # page render killed the worker, forever, every 4-6 seconds.
            #
            # False takes the other branch, whose own comment reads "V8
            # does not support forking, make sure all contexts are
            # disposed"; each worker then builds a fresh context after
            # fork. The cost is losing the pre-forked warm context.
            - name: DISCOURSE_MINI_RACER_SINGLE_THREADED
              value: "false"

            - name: DISCOURSE_DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DISCOURSE_DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DISCOURSE_DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DISCOURSE_DB_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: DISCOURSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: database-password

            - name: DISCOURSE_REDIS_HOST
              value: forum-redis

            - name: DISCOURSE_SMTP_ADDRESS
              value: {{ .Values.mail.address | quote }}
            - name: DISCOURSE_SMTP_PORT
              value: {{ .Values.mail.port | quote }}
            - name: DISCOURSE_SMTP_DOMAIN
              value: {{ .Values.mail.domain | quote }}
            - name: DISCOURSE_SMTP_AUTHENTICATION
              value: {{ .Values.mail.authentication | quote }}
            - name: DISCOURSE_SMTP_ENABLE_START_TLS
              value: {{ .Values.mail.enableStartTls | quote }}
            - name: DISCOURSE_SMTP_FORCE_TLS
              value: {{ .Values.mail.forceTls | quote }}
            - name: DISCOURSE_NOTIFICATION_EMAIL
              value: {{ .Values.mail.notificationEmail | quote }}
            - name: DISCOURSE_SMTP_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: smtp-username
            - name: DISCOURSE_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: smtp-password

            # Rotating this invalidates every session and every signed
            # cookie on the forum. It is not derived from AUTH_SECRET —
            # they are separate blast radii on purpose.
            - name: DISCOURSE_SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: secret-key-base
          volumeMounts:
            - name: state
              mountPath: /var/lib/discourse
            # Sprockets and image processing churn through tmp. On NFS that
            # is slow enough to trip the unicorn timeout, so it is local.
            - name: tmp
              mountPath: /var/lib/discourse/tmp
            # Ruby's Dir.tmpdir tries $TMPDIR, then /tmp, then the cwd —
            # and a scratch image has no /tmp while the cwd is the
            # read-only Nix store, so `db:migrate` died with
            #   ArgumentError: could not find a temporary directory
            # The kubelet creates the mount point, so this fixes it
            # without an image rebuild.
            - name: scratch
              mountPath: /tmp
            - name: runtime
              mountPath: /run/discourse
            - name: logs
              mountPath: /var/log/discourse
          # Discourse boots slowly — migrations, then unicorn forking its
          # workers. 10 minutes of startup budget before liveness begins
          # counting; a first boot on an empty database uses most of it.
          startupProbe:
            httpGet:
              path: /srv/status
              port: http
            failureThreshold: 60
            periodSeconds: 10
          # Deliberately slack. Discourse under load answers /srv/status
          # slowly rather than not at all, and a tight liveness probe
          # turns "slow" into a restart loop that guarantees it never
          # finishes warming up. Restart only after ~3 minutes of a
          # genuinely unresponsive app.
          livenessProbe:
            httpGet:
              path: /srv/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /srv/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # NOT readOnlyRootFilesystem: the entrypoint has to seed
            # /run/discourse from the store on every boot, and Discourse
            # writes into its own tmp tree throughout.
            readOnlyRootFilesystem: false
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: forum-state
        - name: tmp
          emptyDir: {}
        - name: scratch
          emptyDir: {}
        - name: runtime
          emptyDir: {}
        - name: logs
          emptyDir: {}
