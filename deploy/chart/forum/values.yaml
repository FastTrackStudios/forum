# Defaults are the shape of the thing, not the deployment. The cluster
# overrides host/image/mail from the starcommand service module
# (modules/services/forum), which is the single source of truth for what
# actually runs.

image:
  registry: registry.starcommand.live:30050
  repository: forum
  tag: latest
  pullPolicy: IfNotPresent

# ONE. Not a scaling decision — a correctness one. Two pods race
# `db:migrate` on boot, and unicorn_launcher forks the sidekiq workers
# in-process, so a second replica doubles the background workers against
# the same queues. Scale by raising unicornWorkers/sidekiqs, or split
# sidekiq into its own Deployment first (see README).
replicaCount: 1

hostname: forum.fasttrackstudio.app

service:
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  hosts:
    - forum.fasttrackstudio.app
  annotations: {}

# Rails serves public/assets itself. The NixOS module puts nginx in front
# to do this; in the cluster Caddy is the only proxy and it does not know
# the asset tree, so Discourse has to serve it.
serveStaticAssets: true

unicorn:
  # TWO, sized to the node rather than to the app. starcommand is the
  # always-on anchor and it is a 16 GB box that already runs the whole
  # fleet — three pitchfork workers at ~400 MB each took it to 223 MB
  # free and load average 30, and the kubelet started SIGTERMing this pod
  # on a failed liveness probe. thebattleship has 195 GB, but it is the
  # workstation and CI runner, not always-on: a public forum does not
  # belong on a machine that sleeps.
  workers: 2
  sidekiqs: 1
  timeout: 30

# Run db:migrate at boot. True in normal operation; an operator can turn
# it off to bring the app up against a database that is already migrated.
runMigrations: true

# Emails auto-granted admin whenever an account with that address is
# created — however it is created. This is what makes the account that
# arrives through fts-auth an admin the moment it exists, instead of a
# second non-admin user that has to be promoted by hand and linked to a
# local-password account. Comma-separated.
developerEmails: acodywright@gmail.com

# Site settings forced at every boot, as { category: { setting: value } }.
# Empty by default: anything named here is pinned, and an operator editing
# it in /admin would find the change silently reverted on the next restart.
# Prefer /admin for anything that is genuinely a preference; use this for
# settings a rebuilt-from-scratch forum must come up with.
siteSettings: {}

database:
  host: pg-main-rw.databases.svc
  port: 5432
  name: discourse
  username: discourse

redis:
  # In-namespace, single replica, its own PVC. Discourse treats Redis as a
  # cache AND as the sidekiq queue, so losing it drops scheduled jobs but
  # not content — which is why this is local-path and not the NAS.
  enabled: true
  image: docker.io/library/redis:7.4-alpine
  storageClass: local-path
  size: 2Gi

# Nightly tarball of the uploads, on a 7-day ring, to a volume that is not
# the one being backed up. See templates/backup.yaml for why Discourse's
# own /admin/backups does not count.
backup:
  enabled: true
  schedule: "20 4 * * *"
  storageClass: nas-nfs
  size: 20Gi
  # Only needs tar, date and sh.
  image: docker.io/library/alpine:3.21

storage:
  # Uploads and backups — the only forum data that is not in Postgres.
  # NFS because it must outlive the node; Postgres deliberately does not
  # live here (see the databases service).
  storageClass: nas-nfs
  size: 20Gi

mail:
  # Discourse cannot finish its own install without working outbound mail:
  # the admin activation email is step one. There is no in-cluster relay,
  # so this points at a transactional provider.
  address: ""
  port: 587
  # The envelope domain, which must match the DKIM/SPF records at the
  # provider — NOT necessarily the forum hostname.
  domain: fasttrackstudio.app
  authentication: plain
  enableStartTls: true
  forceTls: false
  notificationEmail: noreply@fasttrackstudio.app

# Single sign-on against auth.fasttrackstudio.app. The client secret is in
# the secret named below; everything else is public configuration.
#
# These land as Discourse SITE settings, not backend settings, so they are
# applied once at bootstrap and are then editable in /admin. They are kept
# here so a rebuilt-from-scratch forum comes up already federated.
oauth2:
  enabled: true
  clientId: forum
  issuer: https://auth.fasttrackstudio.app

# Secret holding `secret-key-base`, `database-password`, `smtp-password`
# and `oauth2-client-secret`. Delivered by the cluster secrets app; never
# committed.
secretName: forum-secrets

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    # Below what the node can lose. A limit the node cannot honour is not
    # a safety net — it just moves the failure from this pod to the
    # kubelet and the apiserver, which is what happened at 4Gi.
    memory: 2560Mi
